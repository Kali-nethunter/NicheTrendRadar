name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Prevent simultaneous builds from racing to create/cache different debug keys.
concurrency:
  group: nichetrendradar-android-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Restore the same debug keystore for every main build. The workflow-level
      # concurrency group prevents simultaneous cache misses from racing.
      - name: Restore Android debug signing key
        id: debug-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nichetrendradar-debug-keystore-v1

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Print signing fingerprints for Firebase
        run: gradle --no-daemon :app:signingReport

      # Save the generated key only after the first cache miss.
      - name: Save Android debug signing key
        if: success() && steps.debug-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: nichetrendradar-debug-keystore-v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niche-trend-radar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
